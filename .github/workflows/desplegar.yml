# Avisa a EasyPanel para que despliegue, cada vez que cambia main.
#
# La direccion del webhook lleva un token: NO va en este archivo, va en los
# secretos del repositorio (Settings -> Secrets and variables -> Actions).
# Se llama EASYPANEL_WEBHOOK.

name: Desplegar en EasyPanel

on:
  push:
    branches: [main]
    # Cambios que no afectan a lo que corre en el servidor: no se despliega.
    paths-ignore:
      - '**.md'
      - 'abrir.bat'
      - 'abrir.command'
      - '.gitignore'
      - 'LICENSE'
      # Tocar el propio flujo no cambia lo que corre en el servidor.
      - '.github/**'
  workflow_dispatch:        # para lanzarlo a mano desde la pestaña Actions

concurrency:
  group: despliegue
  cancel-in-progress: true  # si llegan dos push seguidos, solo cuenta el ultimo

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que el secreto existe
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Falta el secreto EASYPANEL_WEBHOOK."
            echo "Ponlo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secreto encontrado."

      - name: Pedir el despliegue
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK }}
        run: |
          # SIN --retry a proposito. Este webhook no es una consulta: cada
          # peticion LANZA UN DESPLIEGUE. Con --retry 3, un tiempo de espera
          # agotado disparaba cuatro compilaciones seguidas del mismo commit.
          #
          # --fail sigue puesto para que un error de verdad del servidor
          # (401, 404, 500) tumbe el paso en vez de pasar por bueno un
          # despliegue que no ocurrio.
          salida=0
          codigo=$(curl --silent --show-error --fail --max-time 25 \
                        --output respuesta.txt --write-out "%{http_code}" \
                        -X POST "$WEBHOOK") || salida=$?

          # 28 = se agoto el tiempo de espera. EasyPanel recibio el aviso pero
          # deja la conexion abierta mientras compila, asi que tarda mas de lo
          # que aguanta curl. El despliegue SI ocurre: no es un fallo.
          if [ "$salida" = "28" ]; then
            echo "Aviso enviado. EasyPanel no contesto en 25 s porque se queda"
            echo "compilando con la conexion abierta; el despliegue va en marcha."
            echo "Mira los logs del servicio en EasyPanel para confirmarlo."
            exit 0
          fi

          if [ "$salida" != "0" ]; then
            echo "El webhook fallo de verdad (codigo de curl $salida)."
            cat respuesta.txt 2>/dev/null || true
            exit 1
          fi

          echo "EasyPanel respondio $codigo"
          cat respuesta.txt 2>/dev/null || true

      - name: Recordatorio
        run: |
          echo "El despliegue lo hace EasyPanel, no este flujo."
          echo "Mira los logs del servicio en EasyPanel para ver si termino bien."
